<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO EP20 不死者 - 任務攻略</title>
<link rel="icon" type="image/png" href="images/sacred_cat_whiskers.png">
<style>
/* ============ 工程師手繪風（黑白極簡） ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
  font-size: 14px;
  background: #ffffff url(images/bg.png) center/100% 100% fixed no-repeat;
  color: #111111;
  line-height: 1.7;
  padding: 24px 12px 60px;
  position: relative;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  pointer-events: none;
  z-index: -1;
}
.wrap { max-width: 780px; margin: 0 auto; }

/* � 標題 — 手�繪感：�雙底線、手�寫標註 */
header { text-align: center; margin-bottom: 26px; }
header h1 {
    font-size: 34px;
    font-weight: 800;
    display: inline-block;
    padding: 6px 12px;
    border-top: 3px solid #111;
    border-bottom: 3px solid #111;
    color: #f0d878;
}
header p { font-size: 13px; color: #555; margin-top: 8px; }
header p::before { content: "// "; color: #999; }

/* 卡片 — 手�繪�框線（微�歪�斜感用 dashed � 混 border） */
.card {
  border: 2px solid #111;
  border-radius: 2px;
  margin-bottom: 20px;
  background: rgba(255,255,255,0.85);
}
.card .hd {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px;
  border-bottom: 2px solid #111;
  background: rgba(245,245,245,0.85);
}
.card .hd h2 { font-size: 16px; font-weight: 700; }

/* 按鈕 — 手繪框 */
.btn {
  font-family: inherit; font-size: 12px;
  background: #fff;
  color: #111;
  border: 2px solid #111;
  border-radius: 2px;
  padding: 3px 10px;
  cursor: pointer;
}
.btn:hover { background: #111; color: #fff; }
.btn:active { transform: translate(2px, 2px); }

/* 材料表 */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 12px; color: #333;
  padding: 6px 10px; border-bottom: 2px solid #111;
  background: #f5f5f5;
}
td { padding: 6px 10px; border-bottom: 1px solid #ddd; font-size: 13px; }
td img { width: 26px; height: 26px; object-fit: contain; vertical-align: middle; }
.qty { text-align: right; font-weight: 700; }
.use { color: #666; }

/* 任務階段 */
.stage-hd { padding: 10px 14px; border-bottom: 2px solid #111; background: #f5f5f5; }
.stage-hd h3 { font-size: 15px; font-weight: 700; }
.stage-hd .warn { font-size: 12px; color: #b00000; margin-top: 3px; }
.step {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 14px;
  border-bottom: 1px dashed #bbb;
}
.step:last-child { border-bottom: none; }
.step input[type=checkbox] { margin-top: 4px; width: 15px; height: 15px; }
.step .id { color: #999; font-size: 11px; margin-right: 3px; font-family: Consolas, monospace; }
.step .op { color: #111; }
.step .note { font-size: 12px; color: #666; margin-top: 2px; }
.step .note::before { content: "// "; color: #999; }
.step .material { font-size: 12px; color: #0055aa; margin-top: 2px; }
.step .reward { font-size: 12px; color: #aa7700; margin-top: 2px; }
.mat-icon { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin: 0 2px; image-rendering: pixelated; }
.step.done { background: #fafafa; }
.step.done .op { text-decoration: line-through; color: #999; }
.navi-btn {
  font-family: Consolas, monospace; font-size: 11px;
  background: #fff;
  color: #111;
  border: 1.5px solid #111;
  border-radius: 2px;
  padding: 1px 7px; margin-left: 5px; cursor: pointer;
}
.navi-btn:hover { background: #111; color: #fff; }
.navi-row { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }

/* 底部 */
footer { text-align: center; margin-top: 24px; }
#reset-progress {
  font-family: inherit; font-size: 13px;
  background: #fff;
  color: #b00000;
  border: 2px solid #b00000;
  border-radius: 2px;
  padding: 6px 18px; cursor: pointer;
}
#reset-progress:hover { background: #b00000; color: #fff; }

.hidden { display: none; }

@media (max-width: 600px) {
  body { font-size: 13px; padding: 14px 8px 40px; }
  header h1 { font-size: 22px; }
  .step { padding: 7px 10px; }
  td, th { padding: 5px 6px; }
}
</style>
</head>
<body>

  </header>

  <!-- 材料需求 Dashboard -->
  <section class="card" id="materials">
    <div class="hd">
      <h2>任務材料需求</h2>

    </div>

        </thead>
        <tbody id="materials-body"></tbody>
      </table>
    </div>
  </section>

  <!-- 任務流程 -->
  <main id="quest"></main>

  <footer>
    <button id="reset-progress">清除所有進度</button>
  </footer>

</div>

/* ============ 渲染 ============ */
const ICONS = {
  '蝴蝶翅膀': 'images/butterfly_wing.png',
  '蠕蟲變身卷軸': 'images/transformation_scroll.png',
  '巨大的暗灰羽毛': 'images/large_gray_feather.png',
  '可波的冠毛': 'images/copos_head_feather.png',
  '冰凍蟲殼': 'images/frozen_insect_shell.png',
  '閃亮海帶莖': 'images/shining_seaweed_stem.png',
  '神聖貓咪鬍鬚': 'images/sacred_cat_whiskers.png',
};
function iconsFor(text) {
  return Object.keys(ICONS).filter(k => text.includes(k))
    .map(k => `<img class="mat-icon" src="${ICONS[k]}" alt="${k}">`).join('');
}

const LS_KEY = 'ro_ep20_progress_v2';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { progress = {}; }

function save() { localStorage.setItem(LS_KEY, JSON.stringify(progress)); }

function copyNavi(navi) {
  const text = '/navi ' + navi;
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  });
}

function naviBtns(step) {
  const list = [];
  const keys = ['navi', 'navi2', 'navi3', 'navi4', 'navi5'];
  keys.forEach(k => { if (step[k]) list.push(step[k]); });
  return list.map(n =>
    `<button class="navi-btn" onclick="copyNavi('${n}')">[複製座標] /navi ${n}</button>`
  ).join('');
}

function renderMaterials() {
  document.getElementById('materials-body').innerHTML = MATERIALS.map(m => `
    <tr>
      <td><img src="${m.icon}" alt="${m.name}"></td>
      <td>${m.name}</td>
      <td class="qty">${m.qty}</td>
      <td class="use">${m.use}</td>
    </tr>`).join('');
}

function renderQuest() {
  document.getElementById('quest').innerHTML = QUEST.map(sg => {
    const stepsHtml = sg.steps.map(st => {
      const checked = progress[st.id] ? 'checked' : '';
      const cls = progress[st.id] ? 'done' : '';
      return `
      <div class="step ${cls}" data-id="${st.id}">
        <input type="checkbox" class="step-check" ${checked}>
        <div class="flex-1">
          <div>
            <span class="id">${st.id}</span>
            <span class="op">${st.op}</span>
          </div>
          ${st.note ? `<div class="note">${st.note}</div>` : ''}
          ${st.material ? `<div class="material">◆ 材料：${iconsFor(st.material)} ${st.material}</div>` : ''}
          ${st.reward ? `<div class="reward">★ 獎勵：${iconsFor(st.reward)} ${st.reward}</div>` : ''}
          ${naviBtns(st) ? `<div class="navi-row">${naviBtns(st)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
    return `
    <section class="card">
      <div class="stage-hd">
        <h3>階段 ${sg.stage}：${sg.title}</h3>
        ${sg.warn ? `<div class="warn">⚠️ ${sg.warn}</div>` : ''}
      </div>
      ${stepsHtml}
    </section>`;
  }).join('');
}

/* ============ 事件 ============ */
document.getElementById('quest').addEventListener('change', e => {
  if (e.target.classList.contains('step-check')) {
    const item = e.target.closest('.step');
    const id = item.dataset.id;
    progress[id] = e.target.checked;
    save();
    item.classList.toggle('done', e.target.checked);
  }
});

document.getElementById('toggle-materials').addEventListener('click', () => {
  document.getElementById('materials-content').classList.toggle('hidden');
});

document.getElementById('reset-progress').addEventListener('click', () => {
  if (confirm('確定要清除所有任務進度？')) {
    progress = {};
    save();
    renderQuest();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

renderMaterials();
renderQuest();
</script>
</body>
</html>
