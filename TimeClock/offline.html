<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeClock - 離線模式</title>
  <style>
    body {
      background: #1e293b;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .offline-container {
      text-align: center;
      padding: 2rem;
    }
    .offline-icon { font-size: 3rem; margin-bottom: 1rem; }
    .offline-title { font-size: 1.5rem; color: #fbbf24; margin-bottom: 0.5rem; }
    .offline-message { color: #94a3b8; margin-bottom: 1.5rem; }
    .offline-button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">離線模式</h1>
    <p class="offline-message">您目前處於離線狀態，記錄已自動保存到本機。<br>恢復網絡連接後，資料將自動同步。</p>
    <button class="offline-button" onclick="window.location.reload()">重試</button>
  </div>
</body>
</html>
